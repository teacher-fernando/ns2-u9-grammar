<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Multi-Quest: Transports</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .title-font { font-family: 'Fredoka One', cursive; }

        .game-container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15), inset 0 -10px 0 rgba(0,0,0,0.05);
            border: 6px solid #fff;
            transition: all 0.3s ease;
        }

        .bounce-in { animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) both; }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Botões 3D para Game Modes */
        .btn-mode {
            transition: all 0.1s;
            border-bottom-width: 6px;
            position: relative;
            overflow: hidden;
        }
        .btn-mode:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-top: 4px;
        }
        .btn-mode:hover::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 0.75s;
        }
        @keyframes shine { 100% { left: 200%; } }

        /* Color Coding para ajudar ESL Kids */
        .grammar-subject { color: #3b82f6; font-weight: 900; } /* Azul para I, He, She */
        .grammar-verb { color: #8b5cf6; font-weight: 900; } /* Roxo para go, goes */
        .grammar-place { color: #10b981; font-weight: 900; } /* Verde para lugares */
        .grammar-transport { color: #f59e0b; font-weight: 900; } /* Laranja para transportes */

        .word-block {
            display: inline-block;
            background: #fff;
            border: 4px solid #e2e8f0;
            border-bottom-width: 8px;
            border-radius: 16px;
            padding: 10px 20px;
            margin: 8px;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .word-block:active { transform: translateY(4px); border-bottom-width: 4px; }
        .word-block.selected { background: #e0f2fe; border-color: #38bdf8; opacity: 0.5; pointer-events: none; }

        .hidden-element { display: none !important; }
        
        .pulse-text { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>

            currentMode = mode;
            currentLevel = 0;
            currentData = eval(`dataMode${mode}`); // Carrega o banco de dados correspondente
            
            // Setup UI
            ui.menu.classList.add('hidden');

            loadLevel();

        function loadLevel() {
            if (currentLevel >= currentData.length) {
                currentLevel = 0; // Loop infinito para a aula não parar
            }

            const data = currentData[currentLevel];
            ui.contentArea.innerHTML = ""; // Limpa a tela

            ui.controlsDefault.classList.remove('hidden');
            ui.controlsJudge.classList.add('hidden');

        function handleReveal() {
            if (currentMode === 1) {
                const blank = document.getElementById('blank-space');
                blank.innerHTML = currentData[currentLevel].answer.toUpperCase();
                blank.className = "inline-block px-6 py-2 bg-green-100 text-green-600 border-b-8 border-green-500 rounded-xl bounce-in";
            } 
            else if (currentMode === 5) {
                document.getElementById('neg-answer').classList.remove('hidden');

            }
            
            ui.controlsDefault.classList.add('hidden');
            ui.controlsJudge.classList.remove('hidden');
        }

        // Ações Modo 2 (True/False)
        function checkTF(guess) {
            const isCorrect = guess === currentData[currentLevel].isTrue;
            const fb = document.getElementById('tf-feedback');
            fb.classList.remove('hidden');
            
            if (isCorrect) {
                fb.innerHTML = "🎉 CORRECT!";
                fb.className = "text-6xl title-font mt-6 text-green-500 bounce-in";
                markCorrect();
            } else {
                fb.innerHTML = "❌ OOPS! WRONG!";
                fb.className = "text-6xl title-font mt-6 text-red-500 bounce-in";
                setTimeout(nextQuestion, 2000);
            }
        }

        // Ações Modo 3 (Word Builder)
        function selectWord(element) {
            const word = element.innerText;
            element.classList.add('selected');
            builderSelectedWords.push(word);
            
            const answerBox = document.getElementById('builder-answer');
            if (builderSelectedWords.length === 1) answerBox.innerHTML = ""; // limpa placeholder
            
            const newBlock = document.createElement('div');
            newBlock.className = "word-block title-font text-white bg-blue-500 border-blue-700 bounce-in";
            newBlock.innerText = word;
            answerBox.appendChild(newBlock);
        }

        function checkBuilder() {
            const data = currentData[currentLevel];
            const currentSentence = builderSelectedWords.join(" ");
            const targetSentence = data.words.join(" ");
            
            if (currentSentence === targetSentence) {
                markCorrect();
            } else {
                const answerBox = document.getElementById('builder-answer');
                answerBox.classList.add('bg-red-100', 'border-red-500');
                setTimeout(() => {
                    answerBox.classList.remove('bg-red-100', 'border-red-500');
                    loadLevel(); // reset
                }, 1500);
            }
        }

        // Ações Modo 4 (Mystery Person)
        function checkMystery(guess) {
            if (guess === currentData[currentLevel].correct) {
                markCorrect();
            } else {
                nextQuestion(); // Pula sem ponto
            }
        }

        function markCorrect() {
            fireConfetti();
            score += 10;
            ui.score.innerText = score;
            ui.score.parentElement.classList.add('scale-125', 'bg-yellow-300');
            setTimeout(() => {
                ui.score.parentElement.classList.remove('scale-125', 'bg-yellow-300');
                nextQuestion(); // Agora SIM avança para TODOS os modos automaticamente
            }, 1500); // 1.5 segundos de festa com confetes antes de pular a pergunta
        }

        function nextQuestion() {
            currentLevel++;
            ui.contentArea.style.opacity = 0;
            setTimeout(() => {
                loadLevel();
                ui.contentArea.style.opacity = 1;
            }, 300);
        }

        function fireConfetti() {
            var duration = 2000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#3b82f6', '#10b981', '#f59e0b'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#8b5cf6', '#ef4444', '#ec4899'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
